name: Nightly API builds

on:
  push:
    branches: [ "develop" ]
  
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sphynx_db

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Wait for Postgres to be ready
      run: |
        sudo apt-get update -y
        sudo apt-get install -y postgresql-client
        export PGPASSWORD=postgres
        until psql -h localhost -U postgres -d sphynx_db -c '\q' >/dev/null 2>&1; do
          sleep 1
        done

    - name: Build with Maven
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 2
        max_attempts: 5
        command: mvn -B package --file pom.xml

    - name: Get Commit SHA
      run: echo "SHA=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"

    - name: Rename artifact
      run: mv target/sphynx-*.jar target/sphynx_${{ matrix.DATABASE }}-${{ env.SHA }}.jar
    
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: Sphynx-${{ matrix.DATABASE }}-API
        path: target/sphynx_*.jar
        
  release-api:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        
    - name: List artifacts folder
      run: ls artifacts

    - name: Release nightly
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "nightly"
        prerelease: true
        title: "Builds de Desenvolvimento"
        files: artifacts/
